# Mirrors main and tags to the SourceForge project
# (https://sourceforge.net/projects/efiction-maintenance/) so the mirror stays
# current without manual pushes. Public repository: Actions minutes cost $0.
name: sourceforge-mirror
on:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SF_MIRROR_SSH_KEY }}" > ~/.ssh/sf_ci_key
          chmod 600 ~/.ssh/sf_ci_key
          printf '%s\n' 'git.code.sf.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGObtXLh/mZom0pXjE5Mu211O+JvtzolqdNKVA+XJ466' > ~/.ssh/known_hosts
          {
            echo 'Host git.code.sf.net'
            echo '  User ariadoss'
            echo '  IdentityFile ~/.ssh/sf_ci_key'
            echo '  IdentitiesOnly yes'
          } >> ~/.ssh/config
      - name: Push main and tags
        run: git push git+ssh://git.code.sf.net/p/efiction-maintenance/code main --tags
