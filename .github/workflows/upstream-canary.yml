# Upstream canary: opens a tracking issue when the official eFiction feed
# (update.efiction.org, signed manifests) ships a release newer than the one
# this fork has verified against, so compatibility is re-checked promptly.
# Public repository: Actions minutes cost $0.
name: upstream-canary
on:
  schedule: [{cron: "0 6 * * 1"}] # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Compare upstream feed
        id: feed
        env: {TESTED_UPSTREAM: "3.5.78"}
        run: |
          latest=$(curl -fsS --max-time 20 https://update.efiction.org/v3/3.5/latest.json | jq -r .version)
          echo "latest=$latest"
          if [ "$(printf '%s\n' "$TESTED_UPSTREAM" "$latest" | sort -V | tail -1)" != "$TESTED_UPSTREAM" ]; then
            echo "newer=$latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Open tracking issue
        if: steps.feed.outputs.newer
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const newer = '${{ steps.feed.outputs.newer }}';
            const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-release'});
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: ['upstream-release'],
                title: `Official eFiction ${newer} shipped — re-verify compatibility`,
                body: [
                  `update.efiction.org now serves ${newer}; this fork last verified against 3.5.7.`,
                  '',
                  'Re-verification steps:',
                  '1. Download the release zip and diff MODERNIZATION.md for schema or password-format changes.',
                  '2. Run the fork harness against a database shaped by the new release (version row + any new columns).',
                  '3. Widen TESTED_UPSTREAM in .github/workflows/upstream-canary.yml and document the delta in CHANGES-MAINTENANCE.md.'
                ].join('\n')
              });
            }
